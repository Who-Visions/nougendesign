[package]
name = "nougendesign-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The nougendesign shell (ADR 0001): Tauri (Rust) around the system webview. Loads compiled design packages, renders surfaces, lists tweaks dimensions and variant plans. Writes nothing."
default-run = "nougendesign-shell"

[lib]
name = "nougendesign_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nougendesign-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nougendesign-shell-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
